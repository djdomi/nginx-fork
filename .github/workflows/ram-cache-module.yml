name: RAM cache module

on:
  push:
    branches:
      - codex/ram-cache-validation
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        workers: [1, 2, 4, 8]
        clients: [1, 10, 50, 100]
    env:
      RAM_CACHE_WORKERS: ${{ matrix.workers }}
      RAM_CACHE_PARALLEL_CLIENTS: ${{ matrix.clients }}
    steps:
      - name: Get the pushed source
        run: |
          git clone --quiet --no-checkout \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git fetch --quiet origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libpcre2-dev libssl-dev \
            zlib1g-dev curl ripgrep

      - name: Configure and build NGINX with the dynamic module
        run: |
          ./auto/configure --with-compat --with-debug \
            --with-http_ssl_module --with-http_v2_module \
            --with-http_slice_module \
            --add-dynamic-module="$GITHUB_WORKSPACE/contrib/ngx_http_ram_cache_module"
          make -j"$(nproc)"
          make -j"$(nproc)" modules

      - name: Run the live integration suite
        run: |
          contrib/ngx_http_ram_cache_module/test.sh \
            "$GITHUB_WORKSPACE/objs/nginx" \
            "$GITHUB_WORKSPACE/objs/ngx_http_ram_cache_module.so"

  address-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the pushed source
        run: |
          git clone --quiet --no-checkout \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git fetch --quiet origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libpcre2-dev libssl-dev \
            zlib1g-dev curl ripgrep

      - name: Configure AddressSanitizer build
        run: |
          ASAN_OPTIONS=detect_leaks=0 ./auto/configure \
            --builddir=/tmp/nginx-ramcache-asan --with-compat --with-debug \
            --with-http_ssl_module --with-http_v2_module \
            --with-http_slice_module \
            --add-dynamic-module="$GITHUB_WORKSPACE/contrib/ngx_http_ram_cache_module" \
            --with-cc-opt='-O1 -g -fsanitize=address -fno-omit-frame-pointer' \
            --with-ld-opt='-fsanitize=address'
          ASAN_OPTIONS=detect_leaks=0 \
            make -f /tmp/nginx-ramcache-asan/Makefile -j2
          ASAN_OPTIONS=detect_leaks=0 \
            make -f /tmp/nginx-ramcache-asan/Makefile -j2 modules

      - name: Run integration suite under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=0:halt_on_error=1
          LSAN_OPTIONS: suppressions=contrib/ngx_http_ram_cache_module/lsan.supp:print_suppressions=1
          RAM_CACHE_WORKERS: 2
          RAM_CACHE_PARALLEL_CLIENTS: 100
        run: |
          contrib/ngx_http_ram_cache_module/test.sh \
            /tmp/nginx-ramcache-asan/nginx \
            /tmp/nginx-ramcache-asan/ngx_http_ram_cache_module.so

  concurrent-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the pushed source
        run: |
          git clone --quiet --no-checkout \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git fetch --quiet origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libpcre2-dev libssl-dev \
            zlib1g-dev curl ripgrep

      - name: Build NGINX and the dynamic module
        run: |
          ./auto/configure --with-compat --with-debug \
            --with-http_ssl_module --with-http_v2_module \
            --with-http_slice_module \
            --add-dynamic-module="$GITHUB_WORKSPACE/contrib/ngx_http_ram_cache_module"
          make -j"$(nproc)"
          make -j"$(nproc)" modules

      - name: Stress concurrent multi-key fills and eviction
        env:
          RAM_CACHE_WORKERS: 8
          RAM_CACHE_PARALLEL_CLIENTS: 100
          RAM_CACHE_STRESS: 1
          RAM_CACHE_STRESS_ROUNDS: 10
        run: |
          contrib/ngx_http_ram_cache_module/test.sh \
            "$GITHUB_WORKSPACE/objs/nginx" \
            "$GITHUB_WORKSPACE/objs/ngx_http_ram_cache_module.so"

  thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the pushed source
        run: |
          git clone --quiet --no-checkout \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git fetch --quiet origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libpcre2-dev libssl-dev \
            zlib1g-dev curl ripgrep

      - name: Configure ThreadSanitizer build
        run: |
          ./auto/configure --builddir=/tmp/nginx-ramcache-tsan \
            --with-compat --with-debug --with-http_ssl_module \
            --with-http_v2_module --with-http_slice_module \
            --add-dynamic-module="$GITHUB_WORKSPACE/contrib/ngx_http_ram_cache_module" \
            --with-cc-opt='-O1 -g -fsanitize=thread -fno-omit-frame-pointer' \
            --with-ld-opt='-fsanitize=thread'
          make -f /tmp/nginx-ramcache-tsan/Makefile -j2
          make -f /tmp/nginx-ramcache-tsan/Makefile -j2 modules

      - name: Run concurrent integration suite under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          RAM_CACHE_WORKERS: 4
          RAM_CACHE_PARALLEL_CLIENTS: 50
          RAM_CACHE_STRESS: 1
          RAM_CACHE_STRESS_ROUNDS: 2
        run: |
          contrib/ngx_http_ram_cache_module/test.sh \
            /tmp/nginx-ramcache-tsan/nginx \
            /tmp/nginx-ramcache-tsan/ngx_http_ram_cache_module.so
